services:
  postgres:
    image: postgres:16
    container_name: valorant_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-valorant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-valorant}
      POSTGRES_DB: ${POSTGRES_DB:-valorant}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-valorant} -d ${POSTGRES_DB:-valorant}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
